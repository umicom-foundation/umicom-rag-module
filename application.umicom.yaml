schema: umicom.application.v1

application:
  id: org.umicom.rag
  name: Umicom RAG
  short_name: RAG
  version: 0.1.0
  executable: umicom-rag-console
  native_executable: umicom-rag
  console_executable: umicom-rag-console
  aliases: [rag]

framework:
  minimum_version: 0.9.0
  compatible_major: 0

frontends:
  - console
  # Shared Framework GTK layout preview; domain services require controllers.
  - gtk

entry:
  kind: workbench
  taskbar_group: artificial-intelligence
  pinned_by_default: false
  default_layout: knowledge

capabilities:
  - umicom.ai.retrieval
  - umicom.knowledge
  - umicom.data
  - umicom.application.experience
  - umicom.application.federation

source_layout:
  product_root: src
  composition_root: src
  console_frontend: src/console

boundaries:
  owns_reusable_framework_logic: false
  owns_persistence: false
  consumes_framework_services: true
